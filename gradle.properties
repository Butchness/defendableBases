# Sets default memory used for gradle commands.
# This is required to provide enough memory for the Minecraft decompilation process.
org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=false

## Environment Properties

# The Minecraft version must agree with the Forge version to get a valid artifact
minecraft_version=1.20.1

# The Minecraft version range
minecraft_version_range=[1.20.1,1.21)

# The Forge version must agree with the Minecraft version
forge_version=47.4.16

# The Forge version range
forge_version_range=[47,)

# The loader version range (major Forge/FML version only)
loader_version_range=[47,)

# Mappings
mapping_channel=official
mapping_version=1.20.1


## Mod Properties

# Unique mod identifier (lowercase, no spaces)
# Must match the @Mod value in your main mod class
mod_id=defendablebases

# Human-readable mod name
mod_name=Defendable Bases

# License
mod_license=All Rights Reserved

# Mod version (semantic versioning recommended)
mod_version=1.0.0

# Group ID (base Java package)
mod_group_id=com.butchness.defendablebases

# Authors shown in Mods list
mod_authors=Butchness

# Mod description (supports \n for new lines)
mod_description=Adds fortress blocks and a fortress center to protect bases.\nIncludes privilege management, overlapping protection, and decay mechanics.
